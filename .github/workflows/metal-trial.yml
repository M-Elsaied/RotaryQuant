name: metal-trial

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/metal-trial.yml"
      - "scripts/metal_vs_mlx_parity.py"

jobs:
  metal:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e mlx-lm
          pip install -e .
          pip install pytest pytest-timeout huggingface_hub requests

      - name: Backend
        run: |
          sysctl -n machdep.cpu.brand_string hw.memsize
          python -c "import platform, mlx.core as mx, mlx_lm; print('mlx', mx.__version__, '| metal', mx.metal.is_available(), '|', mlx_lm.__file__, '|', platform.machine(), 'macOS', platform.mac_ver()[0])"
          python -c "import mlx.core as mx; print(mx.metal.device_info() if mx.metal.is_available() else 'no metal')"

      - name: Targeted tests
        continue-on-error: true
        run: |
          python -m pytest tests/test_provenance.py tests/test_kv_paths.py -q -rs
          cd mlx-lm && python -m pytest tests/test_isoquant_path_report.py tests/test_fused_isoquant_attention.py -q -rs -rf

      - name: Metal vs MLX-ops parity
        if: always()
        run: python scripts/metal_vs_mlx_parity.py

      - name: Full suites (informational)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-out
          python -m pytest tests -q -rf -p no:cacheprovider --continue-on-collection-errors 2>&1 | tee ci-out/root.txt | tail -40
          (cd mlx-lm && python -m pytest tests -q -rf -p no:cacheprovider --timeout=900 --continue-on-collection-errors 2>&1 | tee ../ci-out/mlx-lm.txt | tail -80)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.runner }}
          path: ci-out/
